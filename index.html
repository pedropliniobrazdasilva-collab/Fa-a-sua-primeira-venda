    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        background-color: #050505;
        color: #e2e8f0;
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
        antialiased;
        text-rendering: optimizeLegibility;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Orbitron', sans-serif;
      }
      
      /* Optimized Glass Panel - Less blur for performance */
      .glass-panel {
        background: rgba(20, 20, 20, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      
      .neon-text {
        text-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
      }
      
      /* Animations */
      @keyframes shine {
        100% {
          left: 125%;
        }
      }
      .animate-shine {
        animation: shine 1s;
      }
    </style>
